<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allam Veterinary Clinic</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7f8;color:#17313a}.app{min-height:100vh;display:flex}.side{width:240px;background:#123b45;color:#fff;padding:24px 16px}.brand{font-size:22px;font-weight:800;margin-bottom:30px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#dcecef;text-align:right;padding:13px;border-radius:10px;font-size:15px;cursor:pointer}.nav button.active,.nav button:hover{background:#1b5360;color:#fff}.main{flex:1;padding:28px;max-width:1300px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:27px}.btn{border:0;background:#177d70;color:#fff;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}.card{background:#fff;border:1px solid #e1e9eb;border-radius:14px;padding:18px}.label{color:#71858b;font-size:13px}.num{font-size:28px;font-weight:800;margin-top:7px}.panel{background:#fff;border:1px solid #e1e9eb;border-radius:14px;padding:20px}.search{width:100%;padding:13px;border:1px solid #ccd9dc;border-radius:10px;font-size:15px;margin-bottom:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #edf1f2;text-align:right}.table th{color:#657b81;font-size:13px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e4f4f1;color:#17685e;font-size:12px}.empty{text-align:center;color:#87979b;padding:35px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;border-radius:16px;padding:24px;width:min(650px,100%);max-height:90vh;overflow:auto}.box h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#5e747a}.field input,.field select,.field textarea{padding:11px;border:1px solid #ccd9dc;border-radius:9px;font-size:14px}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-start;gap:10px;margin-top:18px}.secondary{background:#e8eeee;color:#23424a}.view{display:none}.view.active{display:block}.clickrow{cursor:pointer}.clickrow:hover{background:#f7fafb}@media(max-width:800px){.side{width:70px;padding:15px 8px}.brand{font-size:0}.brand:after{content:'AVC';font-size:18px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:22px}.main{padding:18px}.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table{font-size:13px}.hide-mobile{display:none}}
</style></head><body><div id="login" style="position:fixed;inset:0;background:#123b45;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px"><div style="background:#fff;border-radius:18px;padding:30px;width:min(390px,100%);text-align:center;box-shadow:0 20px 60px #0004"><div style="font-size:26px;font-weight:800;color:#123b45;margin-bottom:8px">Allam Veterinary Clinic</div><div style="color:#71858b;margin-bottom:22px">تسجيل دخول العيادة</div><input id="loginUser" placeholder="اسم المستخدم" autocomplete="username" style="width:100%;padding:13px;border:1px solid #ccd9dc;border-radius:10px;margin-bottom:10px;font-size:15px"><input id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password" style="width:100%;padding:13px;border:1px solid #ccd9dc;border-radius:10px;margin-bottom:10px;font-size:15px"><div id="loginErr" style="color:#b42318;font-size:13px;min-height:20px;margin-bottom:8px"></div><button onclick="doLogin()" class="btn" style="width:100%">دخول</button></div></div><div class="app"><aside class="side"><div class="brand">Allam Veterinary Clinic</div><div class="nav"><button class="active" data-view="home">الرئيسية</button><button data-view="patients">الحالات</button></div></aside><main class="main"><div style="display:flex;justify-content:flex-start;margin-bottom:10px"><button class="btn secondary" onclick="logout()">تسجيل الخروج</button></div><section id="home" class="view active"><div class="top"><h1>لوحة العيادة</h1><button class="btn" onclick="openModal()">+ إضافة حالة</button></div><div class="cards"><div class="card"><div class="label">إجمالي الحالات</div><div class="num" id="count">0</div></div><div class="card"><div class="label">حالات اليوم</div><div class="num" id="today">0</div></div><div class="card"><div class="label">عدد الـ Owners</div><div class="num" id="owners">0</div></div></div><div class="panel"><h3>آخر الحالات</h3><div id="recent"></div></div></section><section id="patients" class="view"><div class="top"><h1>الحالات</h1><button class="btn" onclick="openModal()">+ إضافة حالة</button></div><div class="panel"><input class="search" id="search" placeholder="ابحث باسم الحالة أو الـ Owner أو رقم الهاتف..." oninput="renderTable()"><div id="table"></div></div></section></main></div>
<div class="modal" id="modal"><div class="box"><h2>إضافة حالة جديدة</h2><form id="form"><div class="grid"><div class="field"><label>اسم الحالة / الحيوان *</label><input id="pet" required></div><div class="field"><label>اسم الـ Owner *</label><input id="owner" required></div><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel"></div><div class="field"><label>نوع الحيوان</label><select id="type"><option>Cat</option><option>Dog</option><option>Bird</option><option>Rabbit</option><option>Other</option></select></div><div class="field"><label>العمر</label><input id="age" placeholder="مثال: 2 سنة"></div><div class="field"><label>الجنس</label><select id="sex"><option>ذكر</option><option>أنثى</option><option>غير محدد</option></select></div><div class="field full"><label>التشخيص المبدئي</label><input id="diagnosis"></div><div class="field full"><label>ملاحظات</label><textarea id="notes"></textarea></div></div><div class="actions"><button class="btn" type="submit">حفظ الحالة</button><button class="btn secondary" type="button" onclick="closeModal()">إلغاء</button></div></form></div></div>
<script>
const key='allamVetCases';let cases=JSON.parse(localStorage.getItem(key)||'[]');
const AUTH_KEY='allamVetAuth';
function doLogin(){const u=document.getElementById('loginUser').value.trim();const p=document.getElementById('loginPass').value; if(u==='admin'&&p==='admin 1'){sessionStorage.setItem(AUTH_KEY,'1');document.getElementById('login').style.display='none';}else document.getElementById('loginErr').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';}
function logout(){sessionStorage.removeItem(AUTH_KEY);location.reload();}
if(sessionStorage.getItem(AUTH_KEY)==='1')document.getElementById('login').style.display='none';
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function save(){localStorage.setItem(key,JSON.stringify(cases));update();}
function update(){document.getElementById('count').textContent=cases.length;const d=new Date().toISOString().slice(0,10);document.getElementById('today').textContent=cases.filter(x=>x.date===d).length;document.getElementById('owners').textContent=new Set(cases.map(x=>x.owner.trim().toLowerCase())).size;renderRecent();renderTable();}
function renderRecent(){let a=cases.slice().reverse().slice(0,6);document.getElementById('recent').innerHTML=a.length?`<table class="table"><tr><th>الحالة</th><th>Owner</th><th>النوع</th><th>التاريخ</th></tr>${a.map(x=>`<tr><td>${esc(x.pet)}</td><td>${esc(x.owner)}</td><td><span class="tag">${esc(x.type)}</span></td><td>${x.date}</td></tr>`).join('')}</table>`:'<div class="empty">لسه مفيش حالات. ابدأ بإضافة أول حالة.</div>';}
function renderTable(){let q=(document.getElementById('search')?.value||'').toLowerCase();let a=cases.filter(x=>[x.pet,x.owner,x.phone,x.diagnosis].join(' ').toLowerCase().includes(q)).slice().reverse();document.getElementById('table').innerHTML=a.length?`<table class="table"><tr><th>الحالة</th><th>Owner</th><th>الهاتف</th><th>النوع</th><th>التشخيص</th><th>التاريخ</th></tr>${a.map(x=>`<tr class="clickrow" onclick="alert('${esc((x.notes||'لا توجد ملاحظات')).replace(/'/g,"\\'")}')"><td>${esc(x.pet)}</td><td>${esc(x.owner)}</td><td>${esc(x.phone||'-')}</td><td>${esc(x.type)}</td><td>${esc(x.diagnosis||'-')}</td><td>${x.date}</td></tr>`).join('')}</table>`:'<div class="empty">لا توجد نتائج.</div>';}
function esc(s){return String(s??'').replace(/[&<>"`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','`':'&#96;'}[c]));}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('form').reset()}
document.getElementById('form').onsubmit=e=>{e.preventDefault();cases.push({pet:pet.value,owner:owner.value,phone:phone.value,type:type.value,age:age.value,sex:sex.value,diagnosis:diagnosis.value,notes:notes.value,date:new Date().toISOString().slice(0,10)});save();closeModal();};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.view).classList.add('active');update();});update();
</script></body></html>
