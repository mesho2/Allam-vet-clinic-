<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#116b59"><title>عيادة علام البيطرية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--green:#116b59;--green2:#e8f4ef;--ink:#18332d;--muted:#71817c;--line:#e5ece9;--bg:#f5f8f6;--white:#fff;--red:#b74242;--shadow:0 12px 35px #123c2c0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#d9eee5,transparent 38%),var(--bg)}.login-card{width:min(420px,100%);padding:36px;background:white;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.brand-mark{width:54px;height:54px;border-radius:17px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:27px;margin-bottom:20px}.login-card h1{margin:0 0 6px;font-size:25px}.sub{color:var(--muted);margin:0 0 25px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea,.toolbar input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:#62a996;box-shadow:0 0 0 3px #116b5914}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--green);color:#fff;font-weight:650}.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.55;cursor:wait}.btn.secondary{background:#edf4f1;color:var(--green)}.btn.danger{background:#fff0f0;color:var(--red)}.login-card .btn{width:100%;margin-top:10px}.error{color:var(--red);font-size:13px;min-height:18px}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,56px);position:sticky;top:0;z-index:3}.brand{display:flex;gap:12px;align-items:center;font-weight:750}.brand .brand-mark{width:42px;height:42px;border-radius:13px;margin:0;font-size:21px}.user-area{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 72px)}aside{padding:26px 16px;border-left:1px solid var(--line);background:#fff}.nav-label{font-size:11px;color:#97a49f;font-weight:700;padding:8px 12px}.nav button{border:0;background:transparent;color:#586b65;width:100%;text-align:right;padding:11px 12px;border-radius:10px;margin:2px 0;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:var(--green2);color:var(--green);font-weight:700}.main{padding:32px clamp(16px,4vw,48px)}.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.page-head h1{font-size:25px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{background:#fff;padding:18px;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat span{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:9px}.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);gap:15px}.panel-head h2{font-size:16px;margin:0}.toolbar{display:flex;gap:10px;align-items:center}.toolbar input{width:min(280px,45vw)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:right;padding:13px 17px;border-bottom:1px solid #edf1ef;font-size:13px;white-space:nowrap}th{background:#fafcfb;color:#74827d;font-weight:650}tr:last-child td{border-bottom:0}.row-actions{display:flex;gap:7px}.row-actions button{border:0;border-radius:8px;padding:6px 9px;background:#edf4f1;color:var(--green);font-size:12px}.row-actions button.del{color:var(--red);background:#fff0f0}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.notice{padding:11px 14px;border-radius:10px;background:#fff7df;color:#775b14;font-size:13px;margin-bottom:18px}.modal-back{position:fixed;inset:0;background:#10251f77;z-index:5;display:grid;place-items:center;padding:16px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:#f1f5f3;border-radius:8px;padding:7px 10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.form-grid .wide{grid-column:1/-1}.modal-actions{display:flex;gap:9px;justify-content:flex-start;margin-top:18px}.toast{position:fixed;bottom:20px;left:20px;z-index:8;background:#183b32;color:#fff;padding:12px 17px;border-radius:11px;box-shadow:var(--shadow)}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid var(--line);padding:10px 14px;overflow:auto}.nav{display:flex;min-width:max-content}.nav-label{display:none}.nav button{width:auto}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.topbar{height:62px}.user-area span{display:none}.main{padding-top:22px}.page-head{align-items:flex-start;flex-direction:column}.panel-head{align-items:flex-start;flex-direction:column}.toolbar{width:100%}.toolbar input{width:100%}.cards{gap:9px}.stat{padding:14px}.stat strong{font-size:22px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.brand{font-size:14px}}
  </style>
</head>
<body>
<section id="login" class="login-wrap"><form id="loginForm" class="login-card"><div class="brand-mark">✚</div><h1>عيادة علام البيطرية</h1><p class="sub">سجّل الدخول لإدارة بيانات العيادة</p><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="error"></div><button id="loginBtn" class="btn">تسجيل الدخول</button></form></section>
<div id="app" class="app hidden"><header class="topbar"><div class="brand"><div class="brand-mark">✚</div><span>عيادة علام البيطرية</span></div><div class="user-area"><span id="userEmail"></span><button id="logout" class="btn secondary">خروج</button></div></header><div class="layout"><aside><div class="nav-label">القائمة الرئيسية</div><nav id="nav" class="nav"></nav></aside><main id="main" class="main"></main></div></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
// Public browser key only. Never place a Supabase secret/service_role key here.
const SUPABASE_URL='https://sduxhxvnykmggjqldote.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_P_vB7LMkl31WXtqdKrB09Q_Ow06H-or';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const specs={
 owners:{title:'المالكون',singular:'مالك',table:'owners',icon:'👤',cols:[['name','الاسم'],['phone','الهاتف'],['address','العنوان'],['notes','ملاحظات']],fields:[['name','الاسم','text',true],['phone','رقم الهاتف','tel'],['address','العنوان','text'],['notes','ملاحظات','textarea']]},
 patients:{title:'الحيوانات',singular:'حيوان',table:'patients',icon:'🐾',cols:[['name','الاسم'],['species','النوع'],['breed','السلالة'],['owner_id','المالك']],fields:[['name','اسم الحيوان','text',true],['owner_id','المالك','owner'],['species','النوع','text',true],['breed','السلالة','text'],['sex','الجنس','select','ذكر|أنثى'],['birth_date','تاريخ الميلاد','date'],['weight','الوزن (كجم)','number'],['notes','ملاحظات','textarea']]},
 visits:{title:'الزيارات',singular:'زيارة',table:'visits',icon:'🩺',cols:[['patient_id','الحيوان'],['visit_date','التاريخ'],['diagnosis','التشخيص'],['treatment','العلاج']],fields:[['patient_id','الحيوان','patient',true],['visit_date','تاريخ الزيارة','date',true],['diagnosis','التشخيص','text'],['treatment','العلاج','textarea'],['notes','ملاحظات','textarea']]},
 vaccinations:{title:'التطعيمات',singular:'تطعيم',table:'vaccinations',icon:'💉',cols:[['patient_id','الحيوان'],['vaccine_name','اسم التطعيم'],['vaccination_date','تاريخ التطعيم'],['next_due_date','الموعد القادم']],fields:[['patient_id','الحيوان','patient',true],['vaccine_name','اسم التطعيم','text',true],['vaccination_date','تاريخ التطعيم','date',true],['next_due_date','موعد الجرعة القادمة','date'],['notes','ملاحظات','textarea']]},
 payments:{title:'المدفوعات',singular:'دفعة',table:'payments',icon:'💳',cols:[['visit_id','الزيارة'],['amount','المبلغ'],['payment_date','تاريخ الدفع'],['payment_method','طريقة الدفع']],fields:[['visit_id','الزيارة','visit'],['amount','المبلغ','number',true],['payment_date','تاريخ الدفع','date',true],['payment_method','طريقة الدفع','select','نقدي|بطاقة|تحويل'],['notes','ملاحظات','textarea']]}
};
const order=['owners','patients','visits','vaccinations','payments'];let active='owners',rows=[],lookups={owners:[],patients:[],visits:[]},searchText='';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000)}
function errText(e){return e?.message||'حدث خطأ غير متوقع'}
async function boot(){const {data:{session}}=await db.auth.getSession();if(session)showApp(session);db.auth.onAuthStateChange((_event,session)=>{if(session)showApp(session);else showLogin()})}
function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden')}
function showApp(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=session.user.email||'';renderNav();loadPage(active)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';$('loginBtn').disabled=true;const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('loginError').textContent=error.message;return}});
$('logout').onclick=async()=>{await db.auth.signOut()};
function renderNav(){ $('nav').innerHTML=order.map(k=>`<button data-k="${k}" class="${active===k?'active':''}"><span>${specs[k].icon}</span>${specs[k].title}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.k;searchText='';renderNav();loadPage(active)}) }
async function getLookups(){for(const [key,table,cols] of [['owners','owners','id,name'],['patients','patients','id,name'],['visits','visits','id,visit_date']]){const {data,error}=await db.from(table).select(cols).order('created_at',{ascending:false}).limit(500);if(error&&error.code!=='42703')console.warn(error);lookups[key]=data||[]}}
async function loadPage(key){const s=specs[key],main=$('main');main.innerHTML=`<div class="page-head"><div><h1>${s.title}</h1><p>إدارة ${s.title} والبحث في السجلات</p></div><button id="add" class="btn">＋ إضافة ${s.singular}</button></div>${key==='owners'?'<div id="stats" class="cards"></div>':''}<div id="loadError"></div><section class="panel"><div class="panel-head"><h2>السجلات</h2><div class="toolbar"><input id="search" type="search" placeholder="ابحث في السجلات…" value="${esc(searchText)}"><span id="count" style="color:var(--muted);font-size:12px"></span></div></div><div id="tableArea" class="empty">جارٍ تحميل البيانات…</div></section>`;
  $('add').onclick=()=>openForm(key);$('search').oninput=e=>{searchText=e.target.value;renderRows()};
  await getLookups();const {data,error}=await db.from(s.table).select('*').order('created_at',{ascending:false}).limit(1000);if(error){$('loadError').innerHTML=`<div class="notice">تعذر تحميل ${s.title}: ${esc(errText(error))}<br>تأكد أن الجدول موجود وأن سياسات RLS تسمح للمستخدم المسجل بالوصول.</div>`;$('tableArea').innerHTML='';return}rows=data||[];renderRows();if(key==='owners')loadStats();
}
function labelFor(col,val){if(val==null||val==='')return '—';if(col==='owner_id')return lookups.owners.find(x=>x.id===val)?.name||String(val).slice(0,8);if(col==='patient_id')return lookups.patients.find(x=>x.id===val)?.name||String(val).slice(0,8);if(col==='visit_id'){const v=lookups.visits.find(x=>x.id===val);return v?`${v.visit_date||'زيارة'} · ${String(v.id).slice(0,6)}`:String(val).slice(0,8)}if(col==='amount')return `${val} ج.م`;return String(val)}
function renderRows(){const s=specs[active],filtered=rows.filter(row=>Object.values(row).some(v=>String(v??'').toLowerCase().includes(searchText.toLowerCase())));$('count').textContent=`${filtered.length} سجل`;
 if(!filtered.length){$('tableArea').innerHTML=`<div class="empty"><b>${searchText?'لا توجد نتائج':'لا توجد سجلات حتى الآن'}</b>${searchText?'جرّب كلمة بحث أخرى':'اضغط «إضافة» لبدء تسجيل البيانات.'}</div>`;return}
 $('tableArea').innerHTML=`<div class="table-wrap"><table><thead><tr>${s.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>إجراءات</th></tr></thead><tbody>${filtered.map(row=>`<tr>${s.cols.map(([k])=>`<td>${esc(labelFor(k,row[k]))}</td>`).join('')}<td><div class="row-actions"><button data-edit="${esc(row.id)}">تعديل</button><button class="del" data-del="${esc(row.id)}">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`;
 $('tableArea').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(active,rows.find(r=>String(r.id)===b.dataset.edit)));$('tableArea').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRow(active,b.dataset.del));
}
async function loadStats(){const counts={};for(const [key,t] of [['owners','owners'],['patients','patients'],['visits','visits'],['vaccinations','vaccinations']]){const {count,error}=await db.from(t).select('*',{count:'exact',head:true});counts[key]=error?'—':count}if($('stats'))$('stats').innerHTML=[['المالكون',counts.owners],['الحيوانات',counts.patients],['الزيارات',counts.visits],['التطعيمات',counts.vaccinations]].map(([l,n])=>`<div class="stat"><span>${l}</span><strong>${n}</strong></div>`).join('')}
function selectOptions(type){let opts=type==='owner'?lookups.owners.map(x=>[x.id,x.name]):type==='patient'?lookups.patients.map(x=>[x.id,x.name]):lookups.visits.map(x=>[x.id,`${x.visit_date||'زيارة'} · ${String(x.id).slice(0,6)}`]);return `<option value="">اختر…</option>`+opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}
function openForm(key,row={}){const s=specs[key],formFields=s.fields.map(([name,label,type,extra])=>{let value=row[name]??'';let html='';if(type==='textarea')html=`<textarea name="${name}" rows="3">${esc(value)}</textarea>`;else if(['owner','patient','visit'].includes(type))html=`<select name="${name}" ${extra===true?'required':''}>${selectOptions(type)}${value?`<option value="${esc(value)}" selected>${esc(labelFor(name,value))}</option>`:''}</select>`;else if(type==='select')html=`<select name="${name}"><option value="">اختر…</option>${extra.split('|').map(x=>`<option ${value===x?'selected':''}>${x}</option>`).join('')}</select>`;else html=`<input name="${name}" type="${type}" value="${esc(value)}" ${extra===true?'required':''} ${type==='number'?'step="any" min="0"':''}>`;return `<div class="field ${type==='textarea'?'wide':''}"><label>${label}${extra===true&&!['select'].includes(type)?' *':''}</label>${html}</div>`}).join('');
 $('modalRoot').innerHTML=`<div class="modal-back" id="backdrop"><form class="modal" id="recordForm"><div class="modal-head"><h2>${row.id?'تعديل':'إضافة'} ${s.singular}</h2><button type="button" class="close" id="close">✕</button></div><div class="form-grid">${formFields}</div><div id="formError" class="error"></div><div class="modal-actions"><button class="btn" id="save">حفظ</button><button type="button" class="btn secondary" id="cancel">إلغاء</button></div></form></div>`;
 $('close').onclick=$('cancel').onclick=()=> $('modalRoot').innerHTML='';$('backdrop').onclick=e=>{if(e.target.id==='backdrop')$('modalRoot').innerHTML=''};
 $('recordForm').onsubmit=async e=>{e.preventDefault();const btn=$('save');btn.disabled=true;let payload=Object.fromEntries(new FormData(e.currentTarget).entries());for(const [k,v] of Object.entries(payload))if(v==='')payload[k]=null;if(payload.weight!=null)payload.weight=Number(payload.weight);if(payload.amount!=null)payload.amount=Number(payload.amount);let q=row.id?db.from(s.table).update(payload).eq('id',row.id):db.from(s.table).insert(payload);const {error}=await q;if(error){$('formError').textContent=errText(error);btn.disabled=false;return}$('modalRoot').innerHTML='';toast('تم حفظ البيانات');loadPage(key)};
}
async function removeRow(key,id){if(!confirm('هل تريد حذف هذا السجل؟'))return;const {error}=await db.from(specs[key].table).delete().eq('id',id);if(error){toast(`تعذر الحذف: ${errText(error)}`);return}toast('تم حذف السجل');loadPage(key)}
boot();
</script>
</body></html>
